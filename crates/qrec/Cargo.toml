[package]
name = "qrec"
description = "Quick Wayland screen and camera recorder: press R, talk, press R"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "qrec"
path = "src/main.rs"

[dependencies]
qrec-core.workspace = true
qrec-cli.workspace = true
qrec-shell.workspace = true
# `qrec` without a command opens the window (docs/GUI.md G§3.2).
qrec-gui.workspace = true
# Local time in the host log.
chrono = { workspace = true, features = ["clock"] }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
qrec-core = { workspace = true, features = ["testkit"] }
qrec-shell = { workspace = true, features = ["testkit"] }
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
serde_json.workspace = true
# gui_a11y's stand-in AT-SPI registry on the nested bus (WP10): GIO's
# D-Bus, through the workspace's gtk (qrec-gui's; nothing new to build).
gtk.workspace = true

[lints]
workspace = true
