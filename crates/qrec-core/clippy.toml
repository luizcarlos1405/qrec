# qrec-core is the functional core: no I/O, no clocks, no randomness, and
# deterministic iteration order (no HashMap/HashSet). Time, entropy and
# outside facts are injected through `Ctx` (docs/ARCHITECTURE.md A§1.1).
# lib.rs denies these lints, so a violation fails the build under clippy.
disallowed-methods = [
  { path = "std::time::SystemTime::now", reason = "the core is pure: use Ctx::now" },
  { path = "std::time::Instant::now", reason = "the core is pure: use Ctx::now" },
  { path = "chrono::Utc::now", reason = "the core is pure: use Ctx::now", allow-invalid = true },
  { path = "chrono::Local::now", reason = "the core is pure: use Ctx::now", allow-invalid = true },
  { path = "std::env::var", reason = "the core is pure: pass configuration in Ctx::facts" },
  { path = "std::env::var_os", reason = "the core is pure: pass configuration in Ctx::facts" },
  { path = "std::env::vars", reason = "the core is pure: pass configuration in Ctx::facts" },
  { path = "std::env::args", reason = "the core is pure" },
  { path = "std::env::current_dir", reason = "the core is pure: paths are project-relative strings" },
  { path = "std::process::Command::new", reason = "the core is pure: return an Effect with an argv" },
  { path = "std::thread::spawn", reason = "the core is pure: no threads" },
  { path = "std::thread::sleep", reason = "the core is pure: no clocks" },
  { path = "std::fs::read", reason = "the core is pure: no file I/O" },
  { path = "std::fs::read_to_string", reason = "the core is pure: no file I/O" },
  { path = "std::fs::write", reason = "the core is pure: no file I/O" },
  { path = "std::fs::read_dir", reason = "the core is pure: no file I/O" },
  { path = "std::fs::metadata", reason = "the core is pure: no file I/O" },
  { path = "std::fs::symlink_metadata", reason = "the core is pure: no file I/O" },
  { path = "std::fs::create_dir", reason = "the core is pure: no file I/O" },
  { path = "std::fs::create_dir_all", reason = "the core is pure: no file I/O" },
  { path = "std::fs::remove_file", reason = "the core is pure: no file I/O" },
  { path = "std::fs::remove_dir_all", reason = "the core is pure: no file I/O" },
  { path = "std::fs::rename", reason = "the core is pure: no file I/O" },
  { path = "std::fs::copy", reason = "the core is pure: no file I/O" },
  { path = "std::fs::canonicalize", reason = "the core is pure: no file I/O" },
  { path = "std::path::Path::exists", reason = "the core is pure: no file I/O" },
  { path = "std::path::Path::try_exists", reason = "the core is pure: no file I/O" },
  { path = "std::path::Path::is_file", reason = "the core is pure: no file I/O" },
  { path = "std::path::Path::is_dir", reason = "the core is pure: no file I/O" },
  { path = "std::path::Path::metadata", reason = "the core is pure: no file I/O" },
  { path = "std::path::Path::canonicalize", reason = "the core is pure: no file I/O" },
  { path = "std::path::Path::read_dir", reason = "the core is pure: no file I/O" },
  { path = "std::path::Path::read_link", reason = "the core is pure: no file I/O" },
]
disallowed-types = [
  { path = "std::fs::File", reason = "the core is pure: no file I/O" },
  { path = "std::fs::OpenOptions", reason = "the core is pure: no file I/O" },
  { path = "std::process::Command", reason = "the core is pure: return an Effect with an argv" },
  { path = "std::net::TcpStream", reason = "the core is pure: no network" },
  { path = "std::net::TcpListener", reason = "the core is pure: no network" },
  { path = "std::os::unix::net::UnixStream", reason = "the core is pure: no IPC" },
  { path = "std::os::unix::net::UnixListener", reason = "the core is pure: no IPC" },
  { path = "std::time::Instant", reason = "the core is pure: use Ctx::now" },
  { path = "std::time::SystemTime", reason = "the core is pure: use Ctx::now" },
  { path = "std::collections::HashMap", reason = "nondeterministic order breaks snapshots: use BTreeMap" },
  { path = "std::collections::HashSet", reason = "nondeterministic order breaks snapshots: use BTreeSet" },
]
