[package]
name = "qrec-core"
description = "Qrec functional core: project model, commands, planners and state machine (no I/O)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
schemars.workspace = true
chrono.workspace = true
json-patch.workspace = true
sha2.workspace = true
hex.workspace = true
toml.workspace = true
toml_edit.workspace = true
proptest = { workspace = true, optional = true }

[features]
# Pure test helpers (ProjectBuilder, ctx(), proptest strategies) for other crates' tests.
testkit = ["dep:proptest"]

[dev-dependencies]
# Integration tests (tests/*.rs) use the testkit too: enable it on ourselves.
qrec-core = { path = ".", features = ["testkit"] }
proptest.workspace = true
insta.workspace = true
pretty_assertions.workspace = true

[lints]
workspace = true
