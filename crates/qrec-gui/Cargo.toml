[package]
name = "qrec-gui"
description = "Qrec's window: GTK 4 and libadwaita views over the shell's GUI host (docs/GUI.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
qrec-core.workspace = true
# The GUI host, the Session and the capture engine (feature `gst`).
qrec-shell.workspace = true
gtk.workspace = true
adw.workspace = true
pango.workspace = true
gst.workspace = true
crossbeam-channel.workspace = true
serde_json.workspace = true
# The GUI may read the clock (the core may not).
chrono = { workspace = true, features = ["clock"] }
tracing.workspace = true

[dev-dependencies]
qrec-core = { workspace = true, features = ["testkit"] }
qrec-shell = { workspace = true, features = ["testkit"] }
insta.workspace = true
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
